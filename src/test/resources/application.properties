# ==========================================
# CONFIGURACIÓN PARA TESTS CON H2
# ==========================================
spring.application.name=pedido-test

# ==========================================
# BASE DE DATOS H2 PARA TESTS
# ==========================================
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate para tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ==========================================
# SEGURIDAD JWT PARA TESTS
# ==========================================
jwt.secret=test-secret-key-for-jwt-token-generation-must-be-at-least-32-chars
jwt.expiration=86400000

# ==========================================
# RABBITMQ PARA TESTS (desactivado)
# ==========================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

# Desactivar auto-config de RabbitMQ para tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# ==========================================
# LOGGING PARA TESTS
# ==========================================
logging.level.com.syncro.pedido=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
